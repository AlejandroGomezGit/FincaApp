name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Solo para las bases de datos efímeras de este pipeline — nunca se usan
  # fuera de CI, así que no hace falta que vivan en GitHub Secrets.
  CI_JWT_SECRET: ci_test_jwt_secret_not_for_production
  CI_INTERNAL_TOKEN: ci_test_internal_token_not_for_production
  CI_DATABASE_URL: postgresql://fincaapp:ci_test_password@localhost:5432/finca_app

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finca_app
          POSTGRES_USER: fincaapp
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fincaapp -d finca_app"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: services/core-api/package-lock.json }
      # auth-service consume el mismo esquema físico, pero core-api es el
      # único que tiene permitido correr `prisma db push` (ver
      # services/auth-service/prisma/schema.prisma) — así que aplicamos el
      # esquema completo desde ahí antes de correr los tests de auth-service.
      - name: Aplicar schema (vía core-api, el dueño de las migraciones)
        working-directory: services/core-api
        run: |
          npm ci
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - name: Instalar dependencias y generar cliente Prisma
        working-directory: services/auth-service
        run: |
          npm ci
          npx prisma generate
      - name: Tests
        working-directory: services/auth-service
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}

  test-core-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finca_app
          POSTGRES_USER: fincaapp
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fincaapp -d finca_app"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: services/core-api/package-lock.json }
      - name: Instalar dependencias, generar cliente y aplicar schema
        working-directory: services/core-api
        run: |
          npm ci
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - name: Tests
        working-directory: services/core-api
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ env.CI_INTERNAL_TOKEN }}

  test-weather-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: services/weather-service/package-lock.json }
      - name: Instalar dependencias
        working-directory: services/weather-service
        run: npm ci
      - name: Tests
        working-directory: services/weather-service
        run: npm test
        env:
          NODE_ENV: test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build de producción (valida TypeScript, templates y presupuestos)
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-auth-service, test-core-api, test-weather-service, build-frontend]
    strategy:
      matrix:
        service:
          - { name: auth-service, context: services/auth-service }
          - { name: weather-service, context: services/weather-service }
          - { name: core-api, context: services/core-api }
          - { name: gateway, context: services/gateway }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen (${{ matrix.service.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: fincaapp-${{ matrix.service.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Para publicar a un registry (ej. GHCR) en vez de solo construir:
      # 1) agrega `permissions: { packages: write }` a este job,
      # 2) autentica con docker/login-action apuntando a ghcr.io,
      # 3) cambia `push: false` por `push: ${{ github.ref == 'refs/heads/main' }}`
      #    y agrega el tag `ghcr.io/<owner>/fincaapp-${{ matrix.service.name }}:latest`.

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (solo dependencias de producción, por servicio)
        run: |
          for svc in services/auth-service services/weather-service services/core-api frontend; do
            echo "── $svc ──"
            (cd "$svc" && npm install --package-lock-only --silent && npm audit --omit=dev --audit-level=high) || echo "⚠ vulnerabilidades encontradas en $svc (ver arriba)"
          done
        # No falla el job: reporta hallazgos sin bloquear el pipeline. Ver
        # SECURITY.md para el criterio de cuándo una vulnerabilidad sí debe
        # bloquear un release.
      - name: Trivy — escaneo del sistema de archivos (dependencias + IaC)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
      - name: Subir resultados de Trivy a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build (base)
        run: kubectl kustomize k8s/base > /dev/null
      - name: kustomize build (overlay de producción)
        run: kubectl kustomize k8s/overlays/production > /dev/null
