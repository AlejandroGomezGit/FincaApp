apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  namespace: fincaapp
  labels:
    app: weather-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: weather-service }
  template:
    metadata:
      labels: { app: weather-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: weather-service
          image: fincaapp-weather-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: CORE_API_INTERNAL_URL
              valueFrom: { configMapKeyRef: { name: fincaapp-config, key: CORE_API_INTERNAL_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: fincaapp-secrets, key: JWT_SECRET } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: fincaapp-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - name: CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: fincaapp-config, key: CORS_ORIGINS } }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: fincaapp-config, key: LOG_LEVEL } }
          securityContext:
            allowPrivilegeEscalation: false
            # A diferencia de auth-service/core-api, este servicio no usa Prisma
            # ni escribe nada a disco (sin estado real) — puede correr con el
            # filesystem raíz en solo lectura.
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /ready, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: weather-service
  namespace: fincaapp
spec:
  selector: { app: weather-service }
  ports:
    - port: 4002
      targetPort: 4002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weather-service
  namespace: fincaapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
