server {
  # 8080, no 80: el contenedor corre como usuario no-root (ver Dockerfile /
  # k8s/base/frontend.yaml), y bindear un puerto <1024 sin privilegios
  # requeriría la capability NET_BIND_SERVICE que preferimos no otorgar.
  listen 8080;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  # SPA: cualquier ruta que no sea un archivo real cae a index.html para que
  # el router de Angular la resuelva del lado del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los chunks JS de Angular llevan hash en el nombre — cachean para siempre.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
