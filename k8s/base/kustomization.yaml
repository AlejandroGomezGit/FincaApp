apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fincaapp

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml NO se incluye aquí a propósito (no existe en el repo — ver
  # secret.example.yaml). Créalo tú mismo y agrégalo antes de aplicar:
  #   cp secret.example.yaml secret.yaml && kubectl apply -f secret.yaml
  - postgres.yaml
  - auth-service.yaml
  - weather-service.yaml
  - core-api.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: fincaapp
    includeSelectors: false
