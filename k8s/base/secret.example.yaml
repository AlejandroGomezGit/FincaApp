# PLANTILLA — no aplicar tal cual. En un clúster real generarías esto con
# `kubectl create secret generic ... --from-literal=...` (o, mejor aún, con
# un gestor externo como Sealed Secrets / External Secrets Operator / Vault,
# para no tener nunca el valor en texto plano en el repo ni en `kubectl get`).
#
# Para probar localmente:
#   cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#   # reemplaza los valores, luego:
#   kubectl apply -f k8s/base/secret.yaml
# El .gitignore de la raíz ya excluye k8s/**/secret.yaml a propósito.
apiVersion: v1
kind: Secret
metadata:
  name: fincaapp-secrets
  namespace: fincaapp
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change_this_password"
  # Debe coincidir con POSTGRES_USER/POSTGRES_DB del ConfigMap y con la
  # contraseña de arriba — sirve tal cual para auth-service y core-api.
  DATABASE_URL: "postgresql://fincaapp:change_this_password@postgres:5432/finca_app"
  JWT_SECRET: "change_this_to_a_long_random_string"
  INTERNAL_SERVICE_TOKEN: "change_this_to_another_long_random_string"
