# Gateway de FincaApp: único punto de entrada público para el frontend y los
# tres microservicios. En Kubernetes este mismo enrutamiento lo hace un
# Ingress (nginx-ingress) — este archivo es la versión para docker-compose /
# ejecución local, y sirve como referencia de las mismas reglas de path.
#
# A propósito NO existe ninguna location para /internal/* — el puerto interno
# de core-api ni siquiera está declarado en los upstreams, así que no hay
# forma de alcanzarlo a través de este gateway aunque alguien lo intente.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  client_max_body_size 1m;

  upstream auth_service {
    server auth-service:4001;
  }

  upstream weather_service {
    server weather-service:4002;
  }

  upstream core_api {
    server core-api:4000;
  }

  upstream frontend {
    server frontend:8080;
  }

  server {
    listen 80;

    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # auth-service: registro, login, refresh, RBAC.
    location /api/auth/ {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # weather-service: clima y recomendaciones de una finca específica.
    # Debe evaluarse ANTES que el location /api/ genérico de abajo (nginx le
    # da prioridad a esta regex sobre el prefijo /api/ aunque este último
    # aparezca después en el archivo — ver comentario al inicio del archivo).
    location ~ ^/api/farms/[0-9]+/weather {
      proxy_pass http://weather_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # core-api: todo lo demás bajo /api (fincas, cultivos, actividades,
    # jornales, trabajadores, transacciones, dashboard, analítica).
    location /api/ {
      proxy_pass http://core_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Angular (servido como estático por su propio nginx interno).
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
